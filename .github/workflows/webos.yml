name: webOS checks and package

on:
  push:
    branches: [main, 'codex/**']
    paths: ['app/**', 'test/**', 'scripts/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ui
      - run: npm run package:webos
      - uses: actions/upload-artifact@v4
        id: upload
        continue-on-error: true
        if: always()
        with:
          name: lg-stream-${{ github.sha }}
          path: |
            dist/*.ipk
            artifacts/ui-*.png
          if-no-files-found: error
          retention-days: 14
      # Recover only generated IPK/synthetic screenshots if the artifact quota is full.
      # Logs stay inside this private repository; no runtime/user files are included.
      - name: Preserve build output when artifact upload fails
        if: always() && steps.upload.outcome == 'failure'
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, pathlib, tarfile
          paths = sorted(pathlib.Path('dist').glob('*.ipk')) + sorted(pathlib.Path('artifacts').glob('ui-*.png'))
          if not paths:
              raise SystemExit('No generated output to preserve')
          output = io.BytesIO()
          with tarfile.open(fileobj=output, mode='w:gz') as archive:
              for path in paths:
                  archive.add(path, arcname=str(path))
          data = output.getvalue()
          print('LG_OUTPUT_SHA256 ' + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 4000):
              print('LG_OUTPUT_CHUNK ' + encoded[offset:offset + 4000])
          print('LG_OUTPUT_END')
          PYCODE
